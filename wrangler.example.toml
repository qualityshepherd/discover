name = "your-worker-name"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "assets"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

[vars]
DOMAIN_NAME = "your.domain.com"
OWNER = ""  # leave blank — deploy first, go to /admin, derive your pubkey, paste it here, redeploy

[[d1_databases]]
binding = "DISCOVER_DB"
database_name = "your-d1-database-name"
database_id = ""  # wrangler d1 create your-d1-database-name

[[durable_objects.bindings]]
name = "ANALYTICS"
class_name = "AnalyticsDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnalyticsDO"]

[[r2_buckets]]
binding = "R2"
bucket_name = ""  # wrangler r2 bucket create your-bucket-name

[triggers]
crons = ["42 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
